<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WORLDX — 3D Exploration Map</title>
<style>

<div id="brand"><b>WORLDX</b><br>3D LAND EXPLORER · v0.4</div><div id="help">WASD / arrows — move<br>Swipe / drag screen — look around<br>SHIFT — run · SPACE — jump<br>E — enter / exit central house<br>Jump near a window to climb through</div><div id="status">Open countryside · hills · houses</div><div id="toast"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc5df);scene.fog=new THREE.Fog(0x9fc5df,180,620);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,1200);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f3ff,0x59654a,1.7));const sun=new THREE.DirectionalLight(0xffedcf,2.1);sun.position.set(-100,170,90);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-180;sun.shadow.camera.right=180;sun.shadow.camera.top=180;sun.shadow.camera.bottom=-180;scene.add(sun);
const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const wood=mat(0x795238),glass=new THREE.MeshStandardMaterial({color:0x8fc4d8,roughness:.25,metalness:.12}),white=mat(0xe1d8c5),dark=mat(0x343b3d),leaf=mat(0x35633b);
let seed=4421;function rand(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}
function heightAt(x,z){let v=0;for(const h of [[-125,-95,27,62],[-55,130,18,48],[110,80,34,75],[155,-135,23,58],[-175,80,15,55],[30,-190,20,65]]){let d=Math.hypot(x-h[0],z-h[1]);v+=h[2]*Math.exp(-(d*d)/(h[3]*h[3]))}return v+Math.sin(x*.018)*2+Math.cos(z*.021)*2}
const N=150,span=700,positions=[],colors=[],indices=[];for(let iz=0;iz<=N;iz++)for(let ix=0;ix<=N;ix++){let x=(ix/N-.5)*span,z=(iz/N-.5)*span,y=heightAt(x,z);positions.push(x,y,z);let c=new THREE.Color(y>22?0x6c8055:y>9?0x779354:0x66844d);colors.push(c.r,c.g,c.b);if(ix<N&&iz<N){let a=iz*(N+1)+ix,b=a+1,c0=a+N+1,d=c0+1;indices.push(a,c0,b,b,c0,d)}}const terrainGeo=new THREE.BufferGeometry();terrainGeo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));terrainGeo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));terrainGeo.setIndex(indices);terrainGeo.computeVertexNormals();const terrain=new THREE.Mesh(terrainGeo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}));terrain.receiveShadow=true;scene.add(terrain);const groundRay=new THREE.Raycaster();const rayOrigin=new THREE.Vector3(),rayDown=new THREE.Vector3(0,-1,0);function groundHeightAt(x,z){rayOrigin.set(x,1000,z);groundRay.set(rayOrigin,rayDown);const hit=groundRay.intersectObject(terrain,false)[0];return hit?hit.point.y:heightAt(x,z)}
const boxGeo=new THREE.BoxGeometry(1,1,1);function box(parent,x,y,z,w,h,d,m){let o=new THREE.Mesh(boxGeo,m);o.position.set(x,y,z);o.scale.set(w,h,d);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function cylinder(parent,x,y,z,rt,rb,h,m){let o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,8),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
function tree(x,z,s=1){let y=heightAt(x,z);cylinder(scene,x,y+s,z,.22*s,.35*s,2*s,wood);let crown=new THREE.Mesh(new THREE.SphereGeometry(1.7*s,7,6),leaf);crown.position.set(x,y+2.5*s,z);crown.castShadow=true;scene.add(crown)}
const pathPoints=[[-330,190],[-240,125],[-150,80],[-50,20],[45,-25],[150,-90],[250,-150],[340,-195]];for(let i=0;i<pathPoints.length-1;i++){let a=pathPoints[i],b=pathPoints[i+1],dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz),angle=Math.atan2(dx,dz),seg=box(scene,(a[0]+b[0])/2,heightAt((a[0]+b[0])/2,(a[1]+b[1])/2)+.12,(a[1]+b[1])/2,5,.18,len,mat(0x77766d));seg.rotation.y=angle}
const houses=[];function makeHouse(x,z,w,d,wallColor,roofColor,central=false){let y=heightAt(x,z),g=new THREE.Group();g.position.set(x,y,z);scene.add(g);let wall=mat(wallColor),roof=mat(roofColor);box(g,0,1.65,0,w,3.3,d,wall);let r=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.78,2.6,4),roof);r.position.set(0,4.45,0);r.rotation.y=Math.PI/4;r.scale.z=d/w;r.castShadow=true;g.add(r);box(g,-w*.23,1.1,-d/2-.035,.95,2.2,.12,wood);box(g,w*.23,2.05,-d/2-.045,1.25,1.05,.1,glass);box(g,-w*.5-.04,2.05,0,.1,1.05,1.2,glass);box(g,w*.5+.04,2.05,0,.1,1.05,1.2,glass);box(g,w*.23,2.05,-d/2-.11,1.35,.1,.12,white);box(g,w*.23,2.05,-d/2-.11,.1,1.15,.12,white);box(g,0,.18,-d/2-1,w*.75,.25,2,dark);houses.push({x,z,w,d,y,g,central});return g}
makeHouse(0,0,15,12,0xd8cbb5,0x71453b,true);const palette=[[0xc8bda8,0x53616a],[0xd4c9b6,0x80513b],[0xb5c5b0,0x6b4840],[0xd7d0c0,0x50565a],[0xc2a88d,0x7b593c]];for(let i=0;i<34;i++){let x=(rand()-.5)*570,z=(rand()-.5)*570;if(Math.hypot(x,z)<48)continue;let p=palette[i%palette.length];makeHouse(x,z,9+rand()*5,8+rand()*5,p[0],p[1])}
for(let i=0;i<170;i++){let x=(rand()-.5)*650,z=(rand()-.5)*650;if(Math.hypot(x,z)>25)tree(x,z,.55+rand()*.85)}
for(let i=0;i<90;i++){let x=(rand()-.5)*620,z=(rand()-.5)*620;if(Math.hypot(x,z)<35)continue;let rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.7+rand()*2,0),mat(0x77796e));rock.position.set(x,heightAt(x,z)+.3,z);rock.scale.y=.5+rand();rock.rotation.set(rand(),rand(),rand());rock.castShadow=true;scene.add(rock)}
// Interior: kitchen, counters, cooker, fridge, dining and living areas
const interior=new THREE.Group();scene.add(interior);interior.visible=false;const floor=mat(0xb4a18a),insideWall=mat(0xe8dfcf),cabinet=mat(0x795b43),counter=mat(0xd0c5b3);
box(interior,0,0,0,14,.25,11,floor);box(interior,0,1.7,-5.5,14,3.4,.2,insideWall);box(interior,-7,1.7,0,.2,3.4,11,insideWall);box(interior,7,1.7,0,.2,3.4,11,insideWall);box(interior,0,1.7,5.5,14,3.4,.2,insideWall);
box(interior,-4,.65,-3,4,1.3,1.2,cabinet);box(interior,-4,1.35,-3,4,.15,1.3,counter);box(interior,-5.1,1.48,-3,.8,.08,.8,dark);box(interior,-2.9,1.5,-3,.65,.12,.7,mat(0x33383a));box(interior,-4,2.2,-5,4,1.1,.35,cabinet);box(interior,-4,2.8,-5,4,.12,.45,counter);box(interior,-5.9,1.15,-1.4,1.2,2.3,1.2,mat(0xb7b9b5));box(interior,-5.9,2.35,-1.4,1.1,.1,1.1,dark);
box(interior,1,1,0,3.1,.18,1.7,wood);for(let x of [-.2,2.2])for(let z of [-.55,.55])box(interior,x,.48,z,.16,.9,.16,wood);box(interior,3.9,.55,2.8,2.8,1.1,1.2,mat(0x657e7c));box(interior,3.9,1.2,2.8,2.8,.2,1.2,mat(0x9b9c91));box(interior,0,1.5,-5.35,2.3,1.2,.12,glass);box(interior,0,1.5,5.35,2.3,1.2,.12,glass);
// Third-person 3D character
const avatar=new THREE.Group();const skin=mat(0xb98562),shirt=mat(0x263b48),pants=mat(0x242a30),shoe=mat(0x151719);scene.add(avatar);let torso=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.75,4,8),shirt);torso.position.y=1.25;avatar.add(torso);let head=new THREE.Mesh(new THREE.SphereGeometry(.29,10,8),skin);head.position.y=2.05;avatar.add(head);for(let s of [-1,1]){let leg=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.68,3,6),pants);leg.position.set(s*.2,.48,0);avatar.add(leg);let arm=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.62,3,6),shirt);arm.position.set(s*.52,1.35,0);avatar.add(arm);box(avatar,s*.2,.12,-.12,.34,.2,.55,shoe)}
const player={x:0,y:groundHeightAt(0,18)+.22,z:18,vy:0};let yaw=0,pitch=.22,inside=false,clock=0;const keys={};function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2400)}
function enter(){if(inside){inside=false;interior.visible=false;player.x=0;player.z=9;player.y=groundHeightAt(0,9)+.22;toast('Back outside');return}let h=houses[0],dx=player.x-h.x,dz=player.z-(h.z-h.d/2);if(Math.hypot(dx,dz)<7){inside=true;interior.visible=true;player.x=0;player.z=3.4;player.y=1.05;toast('Inside the house — explore the kitchen and living area')}else toast('Go to the large house in the middle of the map')}
document.getElementById('enter').onclick=enter;document.getElementById('jump').onclick=()=>{if(player.vy===0)player.vy=10};const mobileKeys={forward:'w',back:'s',left:'a',right:'d'};for(let [id,k] of Object.entries(mobileKeys)){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(v=>el.addEventListener(v,()=>keys[k]=false))}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')enter();if(e.code==='Space'&&player.vy===0)player.vy=10});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let drag=false,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.005;pitch=Math.max(-.25,Math.min(.85,pitch+(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY});
function update(dt){let f=0,s=0;if(keys.w||keys.arrowup)f+=1;if(keys.s||keys.arrowdown)f-=1;if(keys.a||keys.arrowleft)s-=1;if(keys.d||keys.arrowright)s+=1;let len=Math.hypot(f,s)||1;f/=len;s/=len;let speed=(keys.shift?17:9)*dt,mx=(Math.sin(yaw)*f+Math.cos(yaw)*s)*speed,mz=(Math.cos(yaw)*f-Math.sin(yaw)*s)*speed;if(inside){player.x=THREE.MathUtils.clamp(player.x+mx,-6.1,6.1);player.z=THREE.MathUtils.clamp(player.z-mz,-4.5,4.5);player.y=1.05;player.vy=0}else{let nx=THREE.MathUtils.clamp(player.x+mx,-345,345),nz=THREE.MathUtils.clamp(player.z-mz,-345,345),obstacle=houses.find(h=>Math.abs(nx-h.x)<h.w/2+1&&Math.abs(nz-h.z)<h.d/2+1);if(!obstacle){player.x=nx;player.z=nz}let ground=groundHeightAt(player.x,player.z)+.22;if(player.vy===0){player.y=ground}else{player.vy-=23*dt;player.y+=player.vy*dt;if(player.vy<=0&&player.y<=ground+.45){player.y=ground;player.vy=0}}}
avatar.visible=!inside;let actualGround=groundHeightAt(player.x,player.z);avatar.position.set(player.x,inside?0:player.y-actualGround-.14,player.z);avatar.rotation.y=yaw;let target=new THREE.Vector3(player.x,inside?player.y+1.35:player.y+1.45,player.z),distance=inside?7:8,cx=player.x-Math.sin(yaw)*distance,cz=player.z-Math.cos(yaw)*distance,cy=inside?player.y+3.6:player.y+4.1+pitch*3;if(!inside)cy=Math.max(cy,groundHeightAt(cx,cz)+3.0);camera.position.lerp(new THREE.Vector3(cx,cy,cz),.24);if(!inside){const cameraFloor=groundHeightAt(camera.position.x,camera.position.z)+2.6;if(camera.position.y<cameraFloor)camera.position.y=cameraFloor}camera.lookAt(target);document.getElementById('status').textContent=inside?'Central house · kitchen and living area':'Countryside · elevation '+Math.round(heightAt(player.x,player.z))+' m · '+Math.round(Math.hypot(player.x,player.z))+' m from centre'}
function animate(t){requestAnimationFrame(animate);let dt=Math.min((t-(clock||t))/1000,.04);clock=t;let light=.72+.28*Math.sin(t*.000025);sun.intensity=1.2+light;scene.background.setHSL(.56,.32,.48*light+.08);update(dt);renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});toast('Explore the hills. Jump, climb slopes and visit the central house.');
